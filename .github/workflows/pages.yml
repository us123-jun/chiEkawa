name: Publish game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone game
        env:
          BUILD_ID: ${{ github.sha }}
        run: |
          mkdir -p _site
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          html = Path('index.html').read_text()
          assert len(re.findall(r'<meta name="game-build" content="[^"]+">', html)) == 1
          Path('_site/index.html').write_text(re.sub(r'(<meta name="game-build" content=")[^"]+(">)', lambda m: m[1] + os.environ['BUILD_ID'] + m[2], html))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
