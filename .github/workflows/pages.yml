name: Publish game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone game
        env:
          BUILD_ID: ${{ github.sha }}
        run: |
          mkdir -p _site
          python3 - <<'PY'
          from pathlib import Path
          import os
          html = Path('index.html').read_text()
          assert html.count('content="__BUILD_ID__"') == 1
          Path('_site/index.html').write_text(html.replace('content="__BUILD_ID__"', 'content="' + os.environ['BUILD_ID'] + '"'))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
